<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Shop - Koleksi Topi Eksklusif</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo" onclick="showSection('home')">Z Shop</div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Cari model topi favoritmu...">
                <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-links">
                <div class="nav-item" onclick="showSection('home')">
                    <i class="fas fa-home"></i>
                    <span>Beranda</span>
                </div>
                <div class="nav-item" onclick="showSection('cart')">
                    <div class="cart-icon-container">
                        <i class="fas fa-shopping-bag"></i>
                        <span id="cart-count">0</span>
                    </div>
                    <span>Keranjang</span>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <!-- Content will be injected here by script.js -->
    </main>

    <div id="whatsapp-float">
        <a href="https://wa.me/6288973262022" target="_blank" title="Chat WhatsApp">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Hubungi Kami</h3>
                <p><i class="fas fa-envelope"></i> machie8910@gmail.com</p>
                <p><i class="fab fa-whatsapp"></i> +6288973262022</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 kelompok 6. Semua hak dilindungi</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
